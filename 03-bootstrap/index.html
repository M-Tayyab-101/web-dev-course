<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap Grid</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* just so we can see the columns clearly */
    .col-6, .col-4, .col-3, .col-8 {
      border: 1px solid red;
      padding: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">

    <h2>Two Equal Columns (6+6)</h2>
    <div class="row">
      <div class="col-6">Left Half</div>
      <div class="col-6">Right Half</div>
    </div>

    <h2>Three Equal Columns (4+4+4)</h2>
    <div class="row">
      <div class="col-4">Column 1</div>
      <div class="col-4">Column 2</div>
      <div class="col-4">Column 3</div>
    </div>

    <h2>Four Equal Columns (3+3+3+3)</h2>
    <div class="row">
      <div class="col-3">Col 1</div>
      <div class="col-3">Col 2</div>
      <div class="col-3">Col 3</div>
      <div class="col-3">Col 4</div>
    </div>

    <h2>Sidebar Layout (8+4)</h2>
    <div class="row">
      <div class="col-8">Main Content</div>
      <div class="col-4">Sidebar</div>
    </div>

  </div>

</body>
</html>
