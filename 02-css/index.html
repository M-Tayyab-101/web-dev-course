<!DOCTYPE html>
<html>
<head>
  <title>Flexbox Lesson</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Default - No Flex</h2>
  <div class="no-flex">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <h2>With Flex - Side by Side</h2>
  <div class="with-flex">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <h2>Flex - Centered</h2>
  <div class="flex-center">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <h2>Flex - Space Between</h2>
  <div class="flex-space">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

</body>
</html>
